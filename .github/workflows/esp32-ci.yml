name: esp32-ci

on:
  pull_request:
    paths:
      - 'esp32/**'
      - 'shared/**'
      - 'scripts/espview_profile*'
      - 'scripts/ci_esp32*'
      - 'examples/**'
      - '.github/workflows/esp32-ci.yml'
  push:
    paths:
      - 'esp32/**'
      - 'shared/**'
      - 'scripts/espview_profile*'
      - 'scripts/ci_esp32*'
      - 'examples/**'
      - '.github/workflows/esp32-ci.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile(s) to build'
        type: choice
        options:
          - all
          - uart
          - tcp
          - oled
          - oled-off
          - diagnostic
          - g1_a
          - g1_b
          - g1_c
          - g1_d
        default: all

concurrency:
  group: esp32-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  esp32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'all' && '["uart","tcp","oled","oled-off","diagnostic","g1_a","g1_b","g1_c","g1_d"]' || (inputs.profile != '' && format('["{0}"]', inputs.profile)) || '["uart","tcp","diagnostic"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ESP-IDF managed components
        uses: actions/cache@v4
        with:
          path: esp32/managed_components
          key: ${{ runner.os }}-idf-${{ hashFiles('esp32/dependencies.lock') }}

      - name: Validate profile
        run: python3 scripts/espview_profile_sdkconfig.py --check ${{ matrix.profile }}

      - name: Apply profile sdkconfig
        run: python3 scripts/espview_profile_sdkconfig.py --apply ${{ matrix.profile }} --sdkconfig "$GITHUB_WORKSPACE/esp32/build/${{ matrix.profile }}/sdkconfig" --seed-defaults "$GITHUB_WORKSPACE/esp32/sdkconfig.defaults"

      - name: Build firmware
        working-directory: esp32
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py -B build/${{ matrix.profile }} -D SDKCONFIG="$GITHUB_WORKSPACE/esp32/build/${{ matrix.profile }}/sdkconfig" build 2>&1 | tee build/${{ matrix.profile }}/idf_build.log

      - name: Verify build artifacts
        working-directory: esp32
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          ls -l build/${{ matrix.profile }}/espview_esp32.bin
          ls -l build/${{ matrix.profile }}/bootloader/bootloader.bin
          ls -l build/${{ matrix.profile }}/partition_table/partition-table.bin
          idf.py -B build/${{ matrix.profile }} size

      - name: Generate checksums
        working-directory: esp32
        run: |
          cd build/${{ matrix.profile }}
          sha256sum espview_esp32.bin bootloader/bootloader.bin partition_table/partition-table.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.profile }}
          path: |
            esp32/build/${{ matrix.profile }}/espview_esp32.bin
            esp32/build/${{ matrix.profile }}/bootloader/bootloader.bin
            esp32/build/${{ matrix.profile }}/partition_table/partition-table.bin
            esp32/build/${{ matrix.profile }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Print build diagnostics
        if: failure()
        run: |
          tail -n 120 esp32/build/${{ matrix.profile }}/idf_build.log 2>/dev/null || true
          tail -n 120 esp32/build/${{ matrix.profile }}/CMakeFiles/CMakeError.log 2>/dev/null || true
          find esp32/build/${{ matrix.profile }} -maxdepth 2 -type f -name '*.log' -exec tail -n 60 {} \; 2>/dev/null || true

  # M8-A6 §二十一/§三十八：ESP32-S3 compile portability smoke（experimental）。
  # 只做 configure + compile（不 flash、不做 S3 peripheral integration）；
  # 使用 sdkconfig.defaults（UART transport + LVGL + OLED off，无凭据）。
  # 不在 PR 上运行（Nightly / push main / 手动）；结果失败只影响本 job。
  esp32s3-smoke:
    name: ESP32-S3 compile smoke (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ESP-IDF managed components
        uses: actions/cache@v4
        with:
          path: esp32/managed_components
          key: ${{ runner.os }}-idf-${{ hashFiles('esp32/dependencies.lock') }}

      - name: set-target esp32s3
        working-directory: esp32
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          mkdir -p build/s3
          idf.py -B build/s3 set-target esp32s3 2>&1 | tee build/s3/set_target.log

      - name: Build firmware (esp32s3)
        working-directory: esp32
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py -B build/s3 build 2>&1 | tee build/s3/idf_build.log

      - name: Verify build artifact
        working-directory: esp32
        run: |
          ls -l build/s3/espview_esp32.bin
          sha256sum build/s3/espview_esp32.bin

      - name: Upload S3 smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-smoke-logs
          path: esp32/build/s3/*.log
          if-no-files-found: warn