name: docs-security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run docs checker
        run: |
          python3 -m py_compile scripts/check_docs.py
          python3 scripts/check_docs.py

  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Security scan
        run: |
          mkdir -p check-logs
          python3 scripts/security_scan.py 2>&1 | tee check-logs/security_scan.log

      - name: Check batch file line endings
        run: |
          mkdir -p check-logs
          python3 scripts/check_bat_crlf.py 2>&1 | tee check-logs/check_bat_crlf.log

      - name: Lint workflow YAML files
        run: |
          python3 - <<'EOF' 2>&1 | tee check-logs/yaml_lint.log
          import glob
          import sys
          import yaml

          files = sorted(glob.glob(".github/workflows/*.yml") +
                         glob.glob(".github/workflows/*.yaml"))
          ok = True
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except Exception as exc:
                  print("YAML lint FAIL: %s: %s" % (path, exc))
                  ok = False
          print("YAML lint: checked %d workflow file(s)" % len(files))
          if not ok:
              sys.exit(1)
          EOF

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-security-check-logs
          path: check-logs/
          if-no-files-found: warn